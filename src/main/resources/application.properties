spring.application.name=ventas

server.port=8080

# Lee los valores del archivo .env (en la raiz del proyecto)
spring.config.import=optional:file:.env[.properties]

# Conexion a la base de datos (RDS)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Persistencia con JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mostrar las consultas SQL durante el aprendizaje
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Conexion a RabbitMQ
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=${RABBIT_PORT}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.virtual-host=${RABBIT_VHOST}
spring.rabbitmq.connection-timeout=5s

# Confirmaciones de publicacion
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Recursos creados desde el panel web
app.rabbitmq.exchange=ventas.exchange
app.rabbitmq.routing-key=ventas.creada
